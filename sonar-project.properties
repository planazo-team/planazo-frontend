# Análisis estático con SonarCloud (ESC-05, inspección continua).
# Guía completa: docs/sprint-2/sonarcloud.md
sonar.organization=planazo-team
sonar.projectKey=planazo-team_planazo-frontend
sonar.projectName=planazo-frontend
sonar.sourceEncoding=UTF-8

# La app Next.js vive en frontend/
sonar.sources=frontend/src
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,**/node_modules/**,frontend/.next/**,frontend/public/**,frontend/coverage/**

# Cobertura: el frontend aún no tiene pruebas. Cuando las tenga (Jest o Vitest con
# reporter lcov), el CI las corre con --coverage y SonarCloud lee este archivo.
# Meta del ESC-05 para el frontend: >= 40 %.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
